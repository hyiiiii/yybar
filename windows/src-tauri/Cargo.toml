[package]
name = "yybar"
version = "0.2.0"
description = "yybar for Windows：Codex / Claude Code / Grok / Antigravity 额度与用量"
edition = "2021"
publish = false

[workspace]
members = [".", "core"]

[lib]
name = "yybar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yybar-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
chrono = "0.4"
log = "0.4"
resvg = { version = "0.45", default-features = false }
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
